name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test on Rust 1.86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config

      - name: Install Rust 1.86
        run: |
          rustup toolchain install 1.86 --profile minimal \
              --component rustfmt --component clippy
          rustup default 1.86
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings

      - name: Build (release)
        run: cargo build --release

      # Compile every test (including the nShield integration tests in
      # tests/nshield_integration.rs) so a refactor that breaks them gets
      # caught here, even though the runner has no HSM to actually run them.
      - name: Compile-check all tests (release)
        run: cargo test --release --no-run

      # Run only the unit tests in src/.  The nShield integration tests
      # are excluded from the run because they would all early-return via
      # require_env!() and report as "ok" — confusing log noise.
      - name: Run unit tests (release)
        run: cargo test --release --bins
