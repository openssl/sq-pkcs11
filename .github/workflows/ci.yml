name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config softhsm2 opensc gnupg sq

      - name: Install Rust 1.86
        # The MSRV declared in Cargo.toml, so rust-version is verified here
        # rather than only documented.
        run: |
          rustup toolchain install 1.86 --profile minimal \
              --component rustfmt --component clippy
          rustup default 1.86
          rustc --version

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Run unit tests (release)
        run: cargo test --release --locked --bins

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run the integration suite
        env:
          SQ_PKCS11_TEST_ENV: tests/softhsm.env
        run: uv run --frozen pytest -v
