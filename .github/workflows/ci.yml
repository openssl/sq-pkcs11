name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config softhsm2 opensc gnupg sq rust

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Run unit tests (release)
        run: cargo test --release --bins

      - name: Provision a SoftHSM2 token
        run: tests/provision-softhsm.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run the integration suite
        env:
          SQ_PKCS11_TEST_ENV: tests/softhsm.env
        run: uv run --frozen pytest -v
